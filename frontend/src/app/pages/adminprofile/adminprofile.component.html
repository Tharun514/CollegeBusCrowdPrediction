<div class="container mt-3">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">
                <i class="bi bi-person-fill me-2"></i>
                Admin Profile
            </h3>

        </div>

        <div class="card-body">

            <div class="row">

                <!-- =========================
                     LEFT SIDE
                ========================== -->

                <div class="col-md-3 text-center">

                    <img *ngIf="admin?.photoUrl" [src]="'http://college-bus-crowd-prediction-env.eba-dp7mjwij.ap-south-1.elasticbeanstalk.com/uploads/' + admin.photoUrl"
                        class="img-fluid rounded-circle border shadow">

                    <img *ngIf="!admin?.photoUrl" src="assets/images/user.png"
                        class="img-fluid rounded-circle border shadow">

                    <div class="mt-3">

                        <input type="file" class="form-control" (change)="selectFile($event)">

                    </div>

                    <button class="btn btn-primary w-100 mt-3" (click)="uploadPhoto()">

                        <i class="bi bi-upload"></i>

                        Upload Photo

                    </button>

                </div>

                <!-- =========================
                     RIGHT SIDE
                ========================== -->

                <div class="col-md-9">

                    <div class="mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input type="text" class="form-control" [(ngModel)]="admin.fullName">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input type="text" class="form-control" [(ngModel)]="admin.username">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email" class="form-control" [(ngModel)]="admin.email">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Role
                        </label>

                        <input type="text" class="form-control" [value]="admin.role" readonly>

                    </div>

                    <div class="button-group">

                        <button class="btn btn-success" (click)="updateProfile()">

                            <i class="bi bi-check-circle"></i>

                            Update Profile

                        </button>

                        <button class="btn btn-warning" routerLink="/admin-change-password">

                            <i class="bi bi-lock-fill"></i>

                            Change Password

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
