<div class="settings-page">

    <div class="page-header">

        <h2>
            <i class="bi bi-gear-fill"></i>
            Settings
        </h2>

        <p>Manage your college information and system preferences.</p>

    </div>

    <div class="settings-container">

        <!-- Left Menu -->

        <div class="settings-menu">

            <div class="menu-item active" routerLink="/settings">
                <i class="bi bi-building"></i>
                <span>College Information</span>
            </div>

            <div class="menu-item" routerLink="/college-logo">
                <i class="bi bi-image"></i>
                <span>College Logo</span>
            </div>

            <div class="menu-item" routerLink="/profile">
                <i class="bi bi-person-circle"></i>
                <span>Admin Profile</span>
            </div>

            <div class="menu-item" routerLink="/admin-change-password">
                <i class="bi bi-lock-fill"></i>
                <span>Change Password</span>
            </div>

            <div class="menu-item" routerLink="/theme">
                <i class="bi bi-palette-fill"></i>
                <span>Theme</span>
            </div>

            <div class="menu-item" routerLink="/database-backup">
                <i class="bi bi-database-fill"></i>
                <span>Database Backup</span>
            </div>

        </div>
        <!-- Right Content -->

        <div class="settings-content">

            <div class="settings-card">

                <div class="card-header">

                    <div class="header-left">

                        <h4>College Information</h4>

                        <p>Update your college details displayed across the application.</p>

                    </div>

                    <button class="save-btn" (click)="saveSettings()">

                        <i class="bi bi-check-circle-fill"></i>

                        Save Changes

                    </button>

                </div>

                <div class="form-grid">

                    <div class="form-group">

                        <label>College Name</label>

                        <input type="text" [(ngModel)]="settings.collegeName" name="collegeName"
                            placeholder="Enter College Name">

                    </div>

                    <div class="form-group">

                        <label>College Code</label>

                        <input type="text" [(ngModel)]="settings.collegeCode" name="collegeCode"
                            placeholder="Enter College Code">

                    </div>

                    <div class="form-group">

                        <label>Email</label>

                        <input type="email" [(ngModel)]="settings.email" name="email" placeholder="Enter Email">

                    </div>

                    <div class="form-group">

                        <label>Phone</label>

                        <input type="text" [(ngModel)]="settings.phone" name="phone" placeholder="Enter Phone Number">

                    </div>

                    <div class="form-group full-width">

                        <label>Website</label>

                        <input type="text" [(ngModel)]="settings.website" name="website" placeholder="Enter Website">

                    </div>

                    <div class="form-group full-width">

                        <label>Address</label>

                        <textarea rows="4" [(ngModel)]="settings.address" name="address"
                            placeholder="Enter Address"></textarea>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
