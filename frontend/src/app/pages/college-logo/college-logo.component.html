<div class="settings-page">

    <!-- Page Header -->

    <div class="page-header">

        <h2>
            <i class="bi bi-image-fill"></i>
            College Logo
        </h2>

        <p>Upload and manage your official college logo.</p>

    </div>

    <div class="settings-container">

        <!-- Left Settings Menu -->

        <div class="settings-menu">

            <div class="menu-item" routerLink="/settings">
                <i class="bi bi-building"></i>
                <span>College Information</span>
            </div>

            <div class="menu-item active">
                <i class="bi bi-image"></i>
                <span>College Logo</span>
            </div>

            <div class="menu-item" routerLink="/profile">
                <i class="bi bi-person-circle"></i>
                <span>Admin Profile</span>
            </div>

            <div class="menu-item" routerLink="/admin-change-password">
                <i class="bi bi-lock-fill"></i>
                <span>Change Password</span>
            </div>

            <div class="menu-item" routerLink="/theme">
                <i class="bi bi-palette-fill"></i>
                <span>Theme</span>
            </div>

            <div class="menu-item" routerLink="/database-backup">
                <i class="bi bi-database-fill"></i>
                <span>Database Backup</span>
            </div>

        </div>

        <!-- Right Content -->

        <div class="settings-content">

            <div class="settings-card">

                <!-- Header -->

                <div class="card-header">

                    <div class="header-left">

                        <h4>College Logo</h4>

                        <p>Upload your official college logo.</p>

                    </div>

                    <button class="save-btn" (click)="uploadLogo()">

                        <i class="bi bi-cloud-upload-fill"></i>

                        Upload Logo

                    </button>

                </div>

                <!-- Body -->

                <div class="card-body">

                    <div class="logo-preview">

                        <img *ngIf="logoPreview" [src]="logoPreview" class="college-logo">

                        <img *ngIf="!logoPreview" src="assets/images/college-logo.png" class="college-logo">

                    </div>

                    <input type="file" class="form-control file-input" (change)="onFileSelected($event)">

                </div>

            </div>

        </div>

    </div>

</div>
