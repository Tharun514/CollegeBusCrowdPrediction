<div class="profile-page" *ngIf="student">

    <!-- ===========================
         PAGE HEADER
    ============================ -->

    <div class="page-title">

        <div>

            <h2>My Profile</h2>

            <p>View and update your personal information.</p>

        </div>

        <button class="save-btn" *ngIf="editMode" (click)="saveProfile()">

            <i class="bi bi-check-circle-fill"></i>

            Save Changes

        </button>

    </div>

    <!-- ===========================
         PROFILE LAYOUT
    ============================ -->

    <div class="profile-grid">

        <!-- =====================================
             LEFT SIDEBAR (FIXED)
        ====================================== -->

        <aside class="profile-sidebar">

            <div class="profile-card">

                <!-- IMAGE -->

                <div class="profile-image" (click)="editMode ? fileInput.click() : null">

                    <img [src]="imagePreview" alt="Profile">

                    <button *ngIf="editMode" class="camera-btn" type="button">

                        <i class="bi bi-camera-fill"></i>

                    </button>

                    <input #fileInput hidden type="file" accept="image/*" (change)="selectImage($event)">

                </div>

                <!-- NAME -->

                <h3>

                    {{student.name}}

                </h3>

                <span class="student-id">

                    {{student.rollNo}}

                </span>

                <!-- BADGES -->

                <div class="student-badges">

                    <span class="badge bg-primary">

                        {{student.department}}

                    </span>

                    <span class="badge bg-success">

                        Year {{student.year}}

                    </span>

                </div>

                <!-- BUTTONS -->

                <div class="profile-buttons">

                    <button *ngIf="!editMode" class="edit-btn" (click)="editProfile()">

                        <i class="bi bi-pencil-square"></i>

                        Edit Profile

                    </button>

                    <button *ngIf="editMode" class="cancel-btn" (click)="cancelEdit()">

                        <i class="bi bi-x-circle"></i>

                        Cancel

                    </button>

                </div>

            </div>

        </aside>

        <!-- =====================================
             RIGHT SCROLLABLE CONTENT
        ====================================== -->

        <section class="profile-content">

            <div class="details-section">

                <!-- PERSONAL -->

                <div class="settings-card">

                    <h4>

                        <i class="bi bi-person-fill"></i>

                        Personal Information

                    </h4>

                    <div class="form-grid">

                        <div class="form-group">

                            <label>Full Name</label>

                            <input [(ngModel)]="student.name" [readonly]="!editMode">

                        </div>

                        <div class="form-group">

                            <label>Email</label>

                            <input [(ngModel)]="student.email" [readonly]="!editMode">

                        </div>

                        <div class="form-group">

                            <label>Roll Number</label>

                            <input [(ngModel)]="student.rollNo" readonly>

                        </div>

                        <div class="form-group">

                            <label>Bus Pass Number</label>

                            <input [(ngModel)]="student.busPassNumber" [readonly]="!editMode">

                        </div>

                    </div>

                </div>

                <!-- ACADEMIC -->

                <div class="settings-card">

                    <h4>

                        <i class="bi bi-mortarboard-fill"></i>

                        Academic Information

                    </h4>

                    <div class="form-grid">

                        <div class="form-group">

                            <label>Department</label>

                            <select [(ngModel)]="student.department" [disabled]="!editMode">

                                <option *ngFor="let d of departments" [value]="d">

                                    {{d}}

                                </option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label>Year</label>

                            <select [(ngModel)]="student.year" [disabled]="!editMode">

                                <option *ngFor="let y of years" [value]="y">

                                    {{y}}

                                </option>

                            </select>

                        </div>

                    </div>

                </div>

                <!-- TRANSPORT -->

                <div class="settings-card">

                    <h4>

                        <i class="bi bi-bus-front-fill"></i>

                        Transport Information

                    </h4>

                    <div class="form-grid">

                        <div class="form-group">

                            <label>Route</label>

                            <select [(ngModel)]="student.routeId" [disabled]="!editMode">

                                <option *ngFor="let route of routes" [ngValue]="route.routeId">

                                    {{route.routeName}}

                                </option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label>Bus</label>

                            <select [(ngModel)]="student.busId" [disabled]="!editMode">

                                <option *ngFor="let bus of buses" [ngValue]="bus.busId">

                                    {{bus.busNo}}

                                </option>

                            </select>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </div>

</div>
